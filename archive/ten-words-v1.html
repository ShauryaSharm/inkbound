<html lang="en">

<style>

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1F1E;--surface:#15302E;--ink:#E4EEEB;--muted:#93ABA8;--line:#294745;--board:#0A3A3D;--board-ink:#EAF3F1;--gold:#E8B63A;--good:#4CB97C;--bad:#E86A61;--close:#E8A83A}}
:root[data-theme="dark"]{--bg:#0D1F1E;--surface:#15302E;--ink:#E4EEEB;--muted:#93ABA8;--line:#294745;--board:#0A3A3D;--board-ink:#EAF3F1;--gold:#E8B63A;--good:#4CB97C;--bad:#E86A61;--close:#E8A83A}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:0 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.1}
h2{font-size:1.05rem;font-weight:800;margin:28px 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -16px;padding:12px 16px;background:var(--board);color:var(--board-ink)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}
.brand .tiles{--n:3;justify-content:flex-start}
.brand .tile{width:1.7rem;height:1.9rem;font-size:1rem}
.chips{display:flex;gap:6px}
.chip{background:rgba(255,255,255,.12);color:var(--board-ink);padding:6px 10px;border-radius:999px;font-weight:600;font-size:.9rem}
.tiles{display:flex;flex-wrap:nowrap;gap:4px;justify-content:center}
.tile{--w:min(2.5rem,calc((min(100vw,560px) - 48px - (var(--n) - 1)*4px)/var(--n)));width:var(--w);height:calc(var(--w)*1.12);display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);border-radius:6px;box-shadow:inset 0 -3px 0 var(--tile-edge),0 1px 0 rgba(0,0,0,.15);font-weight:800;font-size:calc(var(--w)*.55);text-transform:uppercase;animation:drop .35s cubic-bezier(.2,1.4,.5,1) both;animation-delay:calc(var(--i)*35ms)}
.tile.ok{background:#CFE9D8;box-shadow:inset 0 -3px 0 #8CC3A1;color:#123D24}
.tile.miss{background:#F5CFCB;box-shadow:inset 0 -3px 0 #D9918A;color:#5A1712}
@keyframes drop{from{transform:translateY(-14px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tile,.pop{animation:none!important}}
.hero{margin-top:20px}
.hero .score{display:flex;align-items:baseline;gap:8px}
.hero .big{font-size:4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.meter{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .4s}
.primary{display:block;width:100%;margin-top:16px;padding:16px;border-radius:14px;background:var(--board);color:var(--board-ink);font-weight:800;font-size:1.1rem}
.primary[disabled]{opacity:.5;cursor:not-allowed}
.secondary{display:block;width:100%;margin-top:10px;padding:14px;border-radius:14px;border:2px solid var(--line);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;background:var(--surface);border-radius:10px;text-align:left;border-left:4px solid var(--tile-edge)}
.word b{font-size:1rem;overflow-wrap:anywhere}
.stars{color:var(--gold);letter-spacing:2px;font-size:.95rem}
.word.bonus{border-left-color:var(--bad)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;background:var(--surface);border-radius:12px;text-align:left}
.mode strong{display:block}
.mode small{color:var(--muted);font-size:.85rem}
.mode[disabled]{opacity:.55;cursor:not-allowed}
.mode .go{font-size:1.4rem;color:var(--muted)}
.mode.boss{background:var(--board);color:var(--board-ink)}
.mode.boss small,.mode.boss .go{color:var(--board-ink);opacity:.8}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0}
.x{font-size:1.4rem;padding:4px 10px;margin-left:-10px}
.combo{font-weight:800;color:var(--gold)}
.hearts{letter-spacing:2px;color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--board)}
.q{margin-top:28px;text-align:center}
.q .ask{color:var(--muted);margin:18px 0 12px}
.q .def{font-size:1.35rem;font-weight:600;line-height:1.3}
.sentence{font-size:1.3rem;line-height:1.5;font-weight:600}
.blank{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--gold);transform:translateY(-.2em)}
.opts{display:flex;flex-direction:column;gap:8px;text-align:left}
.opt{padding:14px;background:var(--surface);border-radius:12px;border:2px solid transparent}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.speak{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--surface);font-weight:600}
.speak.huge{padding:22px 30px;font-size:1.2rem}
.entry{display:flex;gap:8px;margin-top:18px}
.entry input{flex:1;min-width:0;font:inherit;font-size:1.3rem;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;letter-spacing:.04em}
.entry button{padding:0 18px;border-radius:12px;background:var(--board);color:var(--board-ink);font-weight:800}
.hintbar{display:flex;justify-content:center;gap:10px;margin-top:10px;align-items:center}
.link{color:var(--muted);text-decoration:underline;padding:6px}
.feedback{margin-top:22px;padding:16px;border-radius:14px;background:var(--surface);text-align:center}
.feedback h3{font-size:1.3rem;margin-bottom:6px}
.feedback.right h3{color:var(--good)}.feedback.close h3{color:var(--close)}.feedback.wrong h3{color:var(--bad)}
.feedback .tiles{margin:10px 0}
.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.card{margin-top:22px;min-height:300px;padding:28px 18px;background:var(--surface);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;width:100%}
.card .pos{color:var(--muted);font-style:italic}
.card .ex{color:var(--muted)}
mark{background:none;color:var(--ink);font-weight:800;border-bottom:3px solid var(--gold)}
.row{display:flex;gap:8px;margin-top:12px}
.row>*{flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}.dots i.cur{outline:2px solid var(--ink)}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{padding:12px 10px;background:var(--surface);border-radius:10px;border:2px solid transparent;text-align:left;font-size:.92rem;min-height:56px}
.mt.w{font-weight:800;font-size:1rem}
.mt.sel{border-color:var(--gold)}
.mt.done{opacity:.25;pointer-events:none}
.mt.bad{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat div{background:var(--surface);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem}
.stat span{color:var(--muted);font-size:.85rem}
.list{display:flex;flex-direction:column;gap:6px}
.list div{background:var(--surface);border-radius:10px;padding:10px 12px}
.banner{margin-top:18px;padding:16px;border-radius:14px;background:var(--board);color:var(--board-ink);text-align:center;font-weight:700}
.banner.fail{background:var(--surface);color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--surface);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.danger{color:var(--bad)}
.note{font-size:.85rem;color:var(--muted);margin-top:16px;text-align:center}
</style>
</head>

function countdown(){const n=mondayOf(new Date());n.setDate(n.getDate()+7);const ms=n-new Date(),d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`}
function dayNum(d=new Date()){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(s){return String(s).toLowerCase().trim().replace(/[^a-z-]/g,'')}
function lev(a,b){const m=a.length,n=b.length,D=[];for(let i=0;i<=m;i++){D[i]=[i];for(let j=1;j<=n;j++)D[i][j]=i?Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return D}
function alignMarks(a,b){const D=lev(a,b),ok=Array(b.length).fill(false);let i=a.length,j=b.length;while(i>0&&j>0){if(a[i-1]===b[j-1]&&D[i][j]===D[i-1][j-1]){ok[j-1]=true;i--;j--}else if(D[i][j]===D[i-1][j-1]+1){i--;j--}else if(D[i][j]===D[i-1][j]+1)i--;else j--}return ok}
function tiles(s,marks){const t=[...s];return `<div class="tiles" style="--n:${t.length}">${t.map((c,i)=>`<span class="tile${marks?(marks[i]?' ok':' miss'):''}" style="--i:${i}">${esc(c)}</span>`).join('')}</div>`}
function wordRe(w){return new RegExp('\\b'+w+'\\b','i')}

// ---------- state ----------
const DEFAULT=()=>({v:1,updatedAt:0,xp:0,streak:{count:0,last:null,freezes:0},weeks:{},revenge:[],badges:[],settings:{sound:true,rate:0.85}});
function migrate(s){const d=DEFAULT();s=s&&typeof s==='object'?s:{};return {...d,...s,streak:{...d.streak,...(s.streak||{})},settings:{...d.settings,...(s.settings||{})},weeks:s.weeks||{},revenge:s.revenge||[],badges:s.badges||[]}}
let S;try{S=migrate(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=DEFAULT()}
let W,WI,R=null,M=null,view='home',studyIdx=0,flipped=false,DB=null,UID=null,saveTimer=null,confirmReset=false;
const newProg=()=>({box:0,due:0,rec:0,spell:0,ctx:0,boss:0,last:{rec:null,spell:null},got:{rec:false,spell:false},att:0,ok:0});
function stars(p){return p?(p.got.rec?1:0)+(p.got.spell?1:0)+(p.ctx>0&&p.boss>0?1:0):0}

function ensureWeek(){
  const i=weekIndex(),k='w'+i;
  if(!S.weeks[k]){
    for(const [wk,w] of Object.entries(S.weeks)){if(w.closed||wk===k)continue;for(const id of [...w.words,...w.bonus])if(stars(w.prog[id])<3&&!S.revenge.includes(id))S.revenge.push(id);w.closed=true}
    const words=weekWords(i),bonus=S.revenge.filter(id=>BY[id]&&!words.includes(id)).slice(0,3);
    S.revenge=S.revenge.filter(id=>!bonus.includes(id));
    const prog={};[...words,...bonus].forEach(id=>prog[id]=newProg());
    S.weeks[k]={i,words,bonus,prog,studied:[],boss:{best:null,won:false,lastFail:0}};
    const keys=Object.keys(S.weeks).sort((a,b)=>S.weeks[b].i-S.weeks[a].i);keys.slice(6).forEach(x=>delete S.weeks[x]);
    save();
  }
  W=S.weeks[k];WI=i;
}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1500)}
async function pushRemote(){if(!DB||!UID)return;try{await DB.doc('data/users/'+UID+'/vocab').set({json:JSON.stringify(S),updatedAt:S.updatedAt})}catch(e){if(e&&e.code==='invalid_argument')DB=null}}
async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;const id=await user.id();if(!id)return;DB=db;UID=id;
    const snap=await db.doc('data/users/'+id+'/vocab').get();
    if(snap.exists){const d=snap.data();if(d.updatedAt>S.updatedAt&&!R&&!M){S=migrate(JSON.parse(d.json));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}ensureWeek();render()}else if(S.updatedAt>d.updatedAt)pushRemote()}
    else if(S.updatedAt)pushRemote();
    if(view==='profile')render();
  }catch(e){}
}

// ---------- level / streak ----------
function level(xp=S.xp){let n=1;while(xp>=Math.round(100*Math.pow(n,1.5)))n++;return n}
function title(n){return n<5?'Novice':n<10?'Apprentice':n<15?'Wordsmith':n<20?'Scholar':'Lexicon Lord'}
function streakNow(){const s=S.streak,t=dayNum();if(s.last==null)return 0;if(s.last>=t-1)return s.count;if(s.last===t-2&&s.freezes>0)return s.count;return 0}
function bumpStreak(){const s=S.streak,t=dayNum();if(s.last===t)return;if(s.last===t-1)s.count++;else if(s.last===t-2&&s.freezes>0){s.freezes--;s.count++}else s.count=1;s.last=t}

// ---------- audio ----------
const canSpeak='speechSynthesis' in window;
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=S.settings.rate;u.lang='en-US';const v=speechSynthesis.getVoices().find(v=>v.lang==='en-US');if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let AC;function sfx(k){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime,f={good:[660,990],close:[440,470],bad:[240,150],win:[523,1047]}[k];o.type='triangle';o.frequency.setValueAtTime(f[0],t);o.frequency.linearRampToValueAtTime(f[1],t+.15);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.31)}catch(e){}}

// ---------- mastery ----------
function mastery(id,type,ok,hinted,roundId){
  const p=W.prog[id];if(!p)return;p.att++;
  if(ok){p.ok++;p.box=Math.min(4,p.box+1)}else p.box=0;
  p.due=Date.now()+[0,6e5,DAY,2*DAY,NEVER][p.box];
  if(type==='rec'||type==='spell'){
    if(ok&&!hinted){if(p.last[type]!==roundId){p[type]++;p.last[type]=roundId}if(p[type]>=2)p.got[type]=true}
    else if(!ok&&!p.got[type]){p[type]=0;p.last[type]=null}
  }
  if(type==='ctx'&&ok)p.ctx++;
}
const allIds=()=>[...W.words,...W.bonus];
const studiedAll=()=>W.words.every(id=>W.studied.includes(id));
const weekStars=()=>W.words.reduce((s,id)=>s+stars(W.prog[id]),0);
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function bossState(){
  if(W.boss.lastFail&&Date.now()-W.boss.lastFail<36e5)return{ok:false,why:'Try again in '+Math.ceil((36e5-(Date.now()-W.boss.lastFail))/6e4)+' min'};
  if(!studiedAll())return{ok:false,why:'Study all 10 words first'};
  if(W.words.every(id=>stars(W.prog[id])>=2)||new Date().getDay()===0)return{ok:true,why:W.boss.won?'Beaten. Replay for XP':'15 questions, 3 hearts, no hints'};
  return{ok:false,why:'Get 2 stars on every word, or wait for Sunday'};
}

// ---------- rounds ----------
function makeOpts(id,variant){
  const pool=shuffle(allIds().filter(x=>x!==id));while(pool.length<3){const r=BANK[Math.floor(Math.random()*BANK.length)].id;if(r!==id&&!pool.includes(r))pool.push(r)}
  return shuffle([id,...pool.slice(0,3)]);
}
function typeFor(p){if(p.box<=1)return'rec';if(p.box===2)return'spell';return p.ctx===0?'ctx':(Math.random()<.5?'spell':'ctx')}
function pickDaily(){const now=Date.now();return allIds().map(id=>{const p=W.prog[id];return{id,p,k:(p.due<=now?0:10)+p.box+Math.random()*.9}}).sort((a,b)=>a.k-b.k).slice(0,10).map(({id,p})=>({id,type:typeFor(p)}))}
function bossQs(){
  const main=shuffle(W.words),weak=[...W.words].sort((a,b)=>stars(W.prog[a])-stars(W.prog[b])||W.prog[a].box-W.prog[b].box).slice(0,5);
  return shuffle([...main,...weak]).map(id=>({id,type:['rec','spell','spell','ctx'][Math.floor(Math.random()*4)]}));
}
function snapshot(){return Object.fromEntries(allIds().map(id=>[id,stars(W.prog[id])]))}
function startRound(kind){
  let qs;
  if(kind==='daily')qs=pickDaily();
  else if(kind==='spell')qs=shuffle(allIds()).map(id=>({id,type:'spell'}));
  else if(kind==='ctx')qs=shuffle(allIds()).map(id=>({id,type:'ctx'}));
  else qs=bossQs();
  qs.forEach(q=>{if(q.type==='rec'){q.variant=Math.random()<.5?'w2d':'d2w';q.opts=makeOpts(q.id)}});
  R={id:Date.now().toString(36),kind,boss:kind==='boss',qs,i:0,combo:0,best:0,xp:0,correct:0,hearts:3,answered:false,hint:0,missed:[],before:snapshot(),lvl:level()};
  view='round';render();autoSpeak();
}
function autoSpeak(){const q=R&&R.qs[R.i];if(q&&(q.type==='spell'||(q.type==='rec'&&q.variant==='w2d')))speak(BY[q.id].word)}
function answer(val){
  if(!R||R.answered)return;const q=R.qs[R.i],b=BY[q.id];let res;
  if(q.type==='rec')res=val===q.id?'right':'wrong';
  else{const a=norm(val);if(!a)return;const t=[b.word,...b.alt];res=t.includes(a)?'right':Math.min(...t.map(x=>lev(a,x)[a.length][x.length]))===1?'close':'wrong';q.attempt=a}
  q.res=res;q.val=val;R.answered=true;
  const base=R.boss?25:{rec:10,spell:15,ctx:20}[q.type],hinted=R.hint>0;let gain=0;
  if(res==='right'){gain=Math.round(base*Math.min(2,1+.1*R.combo)*(hinted?.5:1));R.combo++;R.best=Math.max(R.best,R.combo);R.correct++;sfx('good')}
  else if(res==='close'){gain=R.boss?0:3;R.combo=Math.floor(R.combo/2);R.missed.push(q.id);sfx('close')}
  else{R.combo=0;if(R.boss)R.hearts--;R.missed.push(q.id);sfx('bad')}
  q.gain=gain;R.xp+=gain;S.xp+=gain;
  mastery(q.id,q.type,res==='right',hinted,R.id);
  if(R.boss&&res==='right')W.prog[q.id].boss++;
  save();render();
  const n=document.getElementById('next');if(n)n.focus({preventScroll:true});
}
function next(){if(!R)return;if(R.boss&&R.hearts<=0)return finish();R.i++;R.answered=false;R.hint=0;if(R.i>=R.qs.length)return finish();render();autoSpeak();const i=document.getElementById('ans');if(i)i.focus()}
function finish(){
  if(R.boss){R.pass=R.correct>=12&&R.hearts>0;if(R.pass){S.xp+=200;R.xp+=200;S.streak.freezes=Math.min(1,S.streak.freezes+1);if(!W.boss.won){W.boss.won=true;S.badges.push({label:weekLabel(WI),score:R.correct})}sfx('win')}else W.boss.lastFail=Date.now();W.boss.best=Math.max(W.boss.best||0,R.correct)}
  bumpStreak();save();view='results';render();
}

// ---------- match ----------
let tick=null;
function startMatch(){
  const ids=shuffle(W.words);
  R={id:Date.now().toString(36),kind:'match',qs:ids.map(id=>({id})),combo:0,best:0,xp:0,correct:0,missed:[],before:snapshot(),lvl:level()};
  M={boards:[ids.slice(0,5),ids.slice(5,10)],b:0,done:[],sel:null,left:60,last:Date.now(),bad:null};
  setupBoard();view='match';render();
  clearInterval(tick);tick=setInterval(()=>{if(!M)return clearInterval(tick);const t=Date.now();M.left-=(t-M.last)/1000;M.last=t;if(M.left<=0){M.left=0;endBoard()}else{const el=document.getElementById('timer');if(el)el.textContent=Math.ceil(M.left)+'s'}},250);
}
function setupBoard(){M.words=shuffle(M.boards[M.b]);M.defs=shuffle(M.boards[M.b]);M.left=60;M.last=Date.now();M.sel=null}
function matchTap(kind,id){
  if(!M.sel||M.sel.kind===kind){M.sel={kind,id};M.bad=null;return render()}
  const w=kind==='w'?id:M.sel.id,d=kind==='d'?id:M.sel.id;M.sel=null;
  if(w===d){const g=Math.round(10*Math.min(2,1+.1*R.combo));R.combo++;R.best=Math.max(R.best,R.combo);R.correct++;R.xp+=g;S.xp+=g;M.done.push(w);mastery(w,'rec',true,false,R.id);sfx('good');M.bad=null;
    if(M.boards[M.b].every(x=>M.done.includes(x))){const bonus=Math.min(5,Math.floor(M.left/12));R.xp+=bonus;S.xp+=bonus;save();return endBoard()}}
  else{R.combo=0;M.left=Math.max(0,M.left-3);if(!R.missed.includes(w))R.missed.push(w);mastery(w,'rec',false,false,R.id);sfx('bad');M.bad=[w,d]}
  save();render();
}
function endBoard(){if(M.b===0){M.b=1;setupBoard();render()}else{clearInterval(tick);M=null;finish()}}

// ---------- render ----------
const app=document.getElementById('app');
function header(){const n=level();return `<header class="bar"><div class="brand">${tiles('ten')}<span>words</span></div><div class="chips"><button class="chip" data-act="profile" aria-label="Profile">Lv ${n}</button><button class="chip" data-act="profile" aria-label="Streak">🔥 ${streakNow()}</button></div></header>`}
function render(){({home:rHome,study:rStudy,round:rRound,results:rResults,match:rMatch,profile:rProfile})[view]()}
function rHome(){
  const ws=weekStars(),sa=studiedAll(),bs=bossState();
  const mode=(act,name,desc,ok,cls='')=>`<button class="mode ${cls}" data-act="${act}" ${ok?'':'disabled'}><span><strong>${name}</strong><small>${desc}</small></span><span class="go">›</span></button>`;
  app.innerHTML=`${header()}
  <section class="hero"><p class="muted">${weekLabel(WI)}</p>
    <div class="score"><span class="big">${ws}</span><span>of 30 stars</span></div>
    <div class="meter"><i style="width:${ws/30*100}%"></i></div>
    <p class="muted">New words in ${countdown()}</p>
    <button class="primary" data-act="daily" ${sa?'':'disabled'}>${sa?'Play daily round':'Study all 10 words to start'}</button></section>
  <h2>This week's words</h2>
  <div class="grid">${W.words.map((id,i)=>`<button class="word" data-act="study" data-i="${i}"><b>${id}</b><span class="stars" aria-label="${stars(W.prog[id])} of 3 stars">${starStr(stars(W.prog[id]))}</span></button>`).join('')}</div>
  ${W.bonus.length?`<h2>Revenge words <span class="muted" style="font-weight:400;font-size:.85rem">double XP, from past weeks</span></h2><div class="grid">${W.bonus.map((id,i)=>`<button class="word bonus" data-act="study" data-i="${W.words.length+i}"><b>${id}</b><span class="stars">${starStr(stars(W.prog[id]))}</span></button>`).join('')}</div>`:''}
  <h2>Modes</h2><div class="modes">
    ${mode('studyStart','Study','Flip cards, hear each word',true)}
    ${mode('match','Meaning match','Pair words with meanings, 60s per board',sa)}
    ${mode('spell','Spell it','Hear it, type it',sa)}
    ${mode('ctx','Context','Fill the blank in a sentence',sa)}
    ${mode('boss','Boss battle',bs.why,bs.ok,'boss')}
  </div>`;
}
function rStudy(){
  const ids=allIds(),id=ids[studyIdx],b=BY[id],p=W.prog[id];
  app.innerHTML=`<div class="top"><button class="x" data-act="home" aria-label="Close">✕</button><span class="muted">${studyIdx+1} of ${ids.length}${W.bonus.includes(id)?' (revenge)':''}</span><span class="stars">${starStr(stars(p))}</span></div>
  <button class="card" data-act="flip" aria-label="Flip card">
    ${tiles(b.word)}
    ${flipped?`<p class="pos">${b.pos}</p><p class="def" style="font-size:1.3rem;font-weight:600">${esc(b.def)}</p><p class="ex">${esc(b.ex).replace(wordRe(b.word),m=>'<mark>'+m+'</mark>')}</p>`:`<p class="muted">Tap to see the meaning</p>`}
  </button>
  <div class="row"><button class="speak" data-act="say" style="justify-content:center">🔊 Hear it</button></div>
  ${flipped?`<div class="row"><button class="secondary" data-act="notyet">Not yet</button><button class="primary" style="margin-top:10px" data-act="gotit">Got it</button></div>`:`<div class="row"><button class="secondary" data-act="prev" ${studyIdx?'':'disabled'}>Back</button><button class="secondary" data-act="skip">Skip</button></div>`}
  <div class="dots">${ids.map((x,i)=>`<i class="${W.studied.includes(x)?'on':''} ${i===studyIdx?'cur':''}"></i>`).join('')}</div>

}
function rRound(){
  const q=R.qs[R.i],b=BY[q.id],bonus=W.bonus.includes(q.id);let body='';
  if(q.type==='rec'){
    const optCls=o=>!R.answered?'':o===q.id?'right':o===q.val?'wrong':'';
    body=q.variant==='w2d'
      ?`${tiles(b.word)}<div class="row" style="justify-content:center"><button class="speak" data-act="say" style="flex:0">🔊</button></div><p class="ask">What does it mean?</p><div class="opts">${q.opts.map(o=>`<button class="opt ${optCls(o)}" data-act="pick" data-id="${o}" ${R.answered?'disabled':''}>${esc(BY[o].def)}</button>`).join('')}</div>`
      :`<p class="def">${esc(b.def)}</p><p class="ask">Which word fits?</p><div class="opts">${q.opts.map(o=>`<button class="opt ${optCls(o)}" data-act="pick" data-id="${o}" ${R.answered?'disabled':''} style="font-weight:700">${o}</button>`).join('')}</div>`;
  }else{
    const hintTxt=R.hint===1?`Starts with “${b.word[0]}”`:R.hint>=2?`“${b.word[0]}” + ${b.word.length-1} more letters (${b.word.length} total)`:'';
    const prompt=q.type==='spell'
      ?(canSpeak?`<button class="speak huge" data-act="say">🔊 Play word</button><p class="ask">${esc(b.def)} <span class="muted">(${b.pos})</span></p>`:`<p class="def">${esc(b.def)}</p><p class="ask">${b.pos}, ${b.word.length} letters</p>`)
      :`<p class="sentence">${esc(b.ex).replace(wordRe(b.word),'<span class="blank"></span>')}</p><p class="ask">Type the missing ${b.pos==='n'?'noun':b.pos==='v'?'verb':'adjective'}</p>`;
    body=`${prompt}
    ${R.answered?'':`<div class="entry"><input id="ans" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Your spelling"><button data-act="check">Check</button></div>
    ${R.boss?'':`<div class="hintbar">${hintTxt?`<span class="muted">${esc(hintTxt)}</span>`:''}${R.hint<2?`<button class="link" data-act="hint">${R.hint?'More help':'Hint (half XP)'}</button>`:''}</div>`}`}`;
  }
  let fb='';
  if(R.answered){
    const h={right:R.combo>2?`Correct! ${R.combo} in a row`:'Correct!',close:'So close',wrong:'Not quite'}[q.res];
    const show=q.type!=='rec'&&q.res!=='right';
    fb=`<div class="feedback ${q.res} pop"><h3>${h}</h3>
      ${show?`<p class="muted">You typed “${esc(q.attempt)}”</p>${tiles(b.word,alignMarks(q.attempt,b.word))}`:''}
      ${q.res==='right'&&q.type!=='rec'?tiles(b.word):''}
      <p><strong>${b.word}</strong>: ${esc(b.def)}</p>
      <p class="muted" style="margin-top:6px">${q.gain?'+'+q.gain+' XP':R.boss&&q.res!=='right'?(q.res==='wrong'?'Lost a heart':'No heart lost'):'+0 XP'}</p>
    </div><button class="primary" id="next" data-act="next">${(R.boss&&R.hearts<=0)||R.i===R.qs.length-1?'See results':'Next'}</button>`;
  }
  app.innerHTML=`<div class="top"><button class="x" data-act="quit" aria-label="Quit round">✕</button>
    ${R.boss?`<span class="hearts" aria-label="${R.hearts} hearts">${'♥'.repeat(R.hearts)}${'♡'.repeat(3-R.hearts)}</span>`:`<span class="combo">${R.combo>0?'×'+Math.min(2,1+.1*R.combo).toFixed(1):''}</span>`}
    <span class="muted">${R.i+1}/${R.qs.length}${bonus?' · revenge':''}</span><span><b>${R.xp}</b> XP</span></div>
    <div class="progress"><i style="width:${R.i/R.qs.length*100}%"></i></div>
    <div class="q">${body}${fb}</div>`;
  const inp=document.getElementById('ans');
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();answer(inp.value)}});
}
function rMatch(){
  const cls=(k,id)=>['mt',k,M.done.includes(id)?'done':'',M.sel&&M.sel.kind===k&&M.sel.id===id?'sel':'',M.bad&&M.bad[k==='w'?0:1]===id?'bad':''].join(' ');
  app.innerHTML=`<div class="top"><button class="x" data-act="quit" aria-label="Quit">✕</button><span class="muted">Board ${M.b+1} of 2</span><span class="timer" id="timer">${Math.ceil(M.left)}s</span><span><b>${R.xp}</b> XP</span></div>
  <p class="muted">Tap a word, then its meaning. A wrong pair costs 3 seconds.</p>
  <div class="match"><div class="col">${M.words.map(id=>`<button class="${cls('w',id)}" data-act="mw" data-id="${id}">${id}</button>`).join('')}</div>
  <div class="col">${M.defs.map(id=>`<button class="${cls('d',id)}" data-act="md" data-id="${id}">${esc(BY[id].def)}</button>`).join('')}</div></div>`;
}
function rResults(){
  const r=R,after=snapshot(),gains=Object.keys(after).filter(id=>after[id]>(r.before[id]||0)),missed=[...new Set(r.missed)],nl=level();
  const name={daily:'Daily round',spell:'Spell it',ctx:'Context',boss:'Boss battle',match:'Meaning match'}[r.kind];
  app.innerHTML=`${header()}<div class="hero"><p class="muted">${name}</p><div class="score"><span class="big">${r.correct}</span><span>of ${r.qs.length} correct</span></div></div>
  ${r.boss?`<div class="banner ${r.pass?'':'fail'} pop">${r.pass?`Boss beaten! +200 XP and a streak freeze`:`Boss wins this time. You need 12 correct with a heart left. Try again in an hour.`}</div>`:''}
  ${nl>r.lvl?`<div class="banner pop">Level up! You're level ${nl}: ${title(nl)}</div>`:''}
  <div class="stat"><div><b>+${r.xp}</b><span>XP</span></div><div><b>${r.best}</b><span>best combo</span></div><div><b>${weekStars()}/30</b><span>week stars</span></div></div>
  ${gains.length?`<h2>New stars</h2><div class="list">${gains.map(id=>`<div><strong>${id}</strong> <span class="stars">${starStr(after[id])}</span></div>`).join('')}</div>`:''}
  ${missed.length?`<h2>Review these</h2><div class="list">${missed.map(id=>`<div><strong>${id}</strong>: ${esc(BY[id].def)}</div>`).join('')}</div>`:''}
  <button class="primary" data-act="again">Play again</button><button class="secondary" data-act="home">Home</button>`;
}
function rProfile(){
  const n=level(),lo=n===1?0:Math.round(100*Math.pow(n-1,1.5)),hi=Math.round(100*Math.pow(n,1.5));
  app.innerHTML=`${header()}<div class="top"><button class="x" data-act="home" aria-label="Back">✕</button></div>
  <div class="hero" style="margin-top:0"><p class="muted">Level ${n}</p><h1 style="font-size:2.4rem">${title(n)}</h1>
  <div class="meter"><i style="width:${(S.xp-lo)/(hi-lo)*100}%"></i></div><p class="muted">${S.xp} XP, ${hi-S.xp} to level ${n+1}</p></div>
  <div class="stat"><div><b>${streakNow()}</b><span>day streak</span></div><div><b>${S.streak.freezes}</b><span>streak freeze</span></div><div><b>${S.badges.length}</b><span>bosses beaten</span></div></div>
  ${S.badges.length?`<h2>Boss badges</h2><div class="list">${S.badges.slice().reverse().map(b=>`<div>🏅 <strong>${esc(b.label)}</strong> <span class="muted">${b.score}/15</span></div>`).join('')}</div>`:''}
  <h2>Settings</h2>
  <button class="toggle" data-act="sound"><span>Sound effects</span><strong>${S.settings.sound?'On':'Off'}</strong></button>
  <button class="toggle" data-act="rate"><span>Voice speed</span><strong>${S.settings.rate<0.8?'Slow':S.settings.rate<1?'Normal':'Fast'}</strong></button>
  <button class="toggle danger" data-act="reset"><span>${confirmReset?'Tap again to erase everything':'Reset all progress'}</span><strong>${confirmReset?'Confirm':''}</strong></button>
  <p class="note">${DB?'Progress syncs to your account.':'Progress is saved in this browser only.'}</p>`;
}

// ---------- events ----------
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,ids=W?allIds():[];
  switch(a){
    case'home':view='home';R=null;confirmReset=false;render();scrollTo(0,0);break;
    case'profile':view='profile';render();scrollTo(0,0);break;
    case'study':studyIdx=+el.dataset.i;flipped=false;view='study';render();break;
    case'studyStart':studyIdx=Math.max(0,ids.findIndex(id=>!W.studied.includes(id)));flipped=false;view='study';render();break;
    case'flip':flipped=!flipped;if(flipped&&!W.studied.includes(ids[studyIdx])){W.studied.push(ids[studyIdx]);save()}render();break;
    case'say':speak(R&&view==='round'?BY[R.qs[R.i].id].word:ids[studyIdx]);break;
    case'prev':studyIdx=Math.max(0,studyIdx-1);flipped=false;render();break;
    case'skip':studyIdx=(studyIdx+1)%ids.length;flipped=false;render();break;
    case'gotit':case'notyet':{const p=W.prog[ids[studyIdx]];if(a==='gotit'){if(p.box===0){p.box=1;p.due=Date.now()+6e5}}else{p.box=0;p.due=0}save();
      if(studiedAll()&&ids.every(id=>W.studied.includes(id))&&studyIdx===ids.length-1){view='home';render();scrollTo(0,0)}else{studyIdx=(studyIdx+1)%ids.length;flipped=false;render()}break}
    case'daily':startRound('daily');break;
    case'spell':startRound('spell');break;
    case'ctx':startRound('ctx');break;
    case'boss':startRound('boss');break;
    case'match':startMatch();break;
    case'pick':answer(el.dataset.id);break;
    case'check':{const i=document.getElementById('ans');if(i)answer(i.value);break}
    case'hint':R.hint++;render();{const i=document.getElementById('ans');if(i)i.focus()}break;
    case'next':next();break;
    case'quit':clearInterval(tick);M=null;R=null;view='home';render();break;
    case'again':{const k=R.kind;k==='match'?startMatch():startRound(k);break}
    case'mw':matchTap('w',el.dataset.id);break;
    case'md':matchTap('d',el.dataset.id);break;
    case'sound':S.settings.sound=!S.settings.sound;save();render();break;
    case'rate':S.settings.rate=S.settings.rate<0.8?0.85:S.settings.rate<1?1.1:0.7;save();render();speak('vocabulary');break;
    case'reset':if(!confirmReset){confirmReset=true;render()}else{const st=S.settings;S=DEFAULT();S.settings=st;confirmReset=false;ensureWeek();save();view='home';render()}break;
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!R&&!M){const k='w'+weekIndex();if(!W||k!=='w'+WI){ensureWeek();render()}}});
if(canSpeak)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
ensureWeek();render();connect();
</script></body></html>
